<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRWN Clothing</title>
    <meta
      name="description"
      content="Everyday essentials, made to last. A modern eCommerce site built with React, TypeScript, Firebase and Stripe."
    />
    <link rel="canonical" href="https://shop.kenechukwu.dev/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Link previews (Open Graph: WhatsApp, Facebook, LinkedIn, Slack).
         Keep og-image.jpg 1200x630 and small: WhatsApp skips large images. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRWN Clothing" />
    <meta property="og:url" content="https://shop.kenechukwu.dev/" />
    <meta property="og:title" content="CRWN Clothing" />
    <meta
      property="og:description"
      content="Everyday essentials, made to last. A modern eCommerce site built with React, TypeScript, Firebase and Stripe."
    />
    <meta
      property="og:image"
      content="https://shop.kenechukwu.dev/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The CRWN Clothing homepage: Everyday essentials, made to last."
    />

    <!-- X / Twitter (falls back to the Open Graph tags above) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@kxnxchukwu" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var saved = JSON.parse(localStorage.getItem("persist:root") || "{}");
        var theme = saved.theme && JSON.parse(saved.theme).theme;
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
